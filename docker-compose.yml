version: "3.9"
services:
  gridwise:
    build: .
    image: gridwise:latest
    container_name: gridwise
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; r=urllib.request.urlopen('http://localhost:8000/health',timeout=3); sys.exit(0 if r.status==200 else 1)"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
